name: Deploy a cPanel

on:
  push:
    branches:
      - backend_php # Se dispara cuando pusheas a esta rama

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obtener código de GitHub
        uses: actions/checkout@v3

      - name: 🛠️ Instalar Node.js y dependencias
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: 🏗️ Ejecutar Build de Vite
        run: |
          npm install
          npm run build

      - name: 🚀 Subir a cPanel vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Subimos SOLO lo que generó Vite
          local-dir: ./dist/ 
          # Carpeta de destino en tu hosting
          server-dir: public_html/agenda/