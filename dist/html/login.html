<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso Corporativo Agenda</title>
  <link rel="shortcut icon" href="/agenda/assets/logo-transparente-tp-link-blanco-BvX_nEZi.png" type="image/x-icon">

  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css"
    rel="stylesheet"
  />
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            corporativo: "#005691", // Azul corporativo más profundo y serio
            corporativoDark: "#153d60", // Un azul casi navy, para el hover
            grisTexto: "#333333", // Negro sobrio para el texto
            grisBorde: "#dddddd", // Borde muy claro
          },
          boxShadow: {
            // Sombra más elegante, típica de tarjetas de apps profesionales
            suave: "0 10px 30px rgba(0,0,0,0.08)",
            // Sombra para el focus del input
            inputFocus: "0 0 0 3px rgba(0, 86, 145, 0.2)",
          },
        },
      },
      daisyui: {
        themes: [
          {
            corporativo: {
              primary: "#005691",
              secondary: "#153d60",
              "base-100": "#ffffff",
              neutral: "#333333",
            },
          },
        ],
      },
    };
  </script>
  <style>
    /* Estado base visible */
    #loginContainer {
      opacity: 1;
      transform: scale(1);
      transition: all 0.7s ease-out;
    }

    /* Solo si JS agrega esta clase, arranca animación */
    .animate-in {
      animation: loginFadeIn 0.6s ease-out forwards;
    }

    @keyframes loginFadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
  <script type="module" crossorigin src="/agenda/assets/modulepreload-polyfill-B5Qt9EMX.js"></script>
  <script type="module" crossorigin src="/agenda/assets/tokenStorage-BJFfxEW5.js"></script>
  <script type="module" crossorigin src="/agenda/assets/main-ZEvpM-X5.js"></script>
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4 text-grisTexto">

  <main id="loginContainer" class="w-full max-w-sm initial-hidden transition-all duration-700 ease-out">
    <section
      class="bg-white border border-grisBorde rounded-2xl shadow-suave p-10 transition-all"
      style="min-width: 380px;"
    >

      <header class="text-center mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight text-corporativoDark">
          <span class="text-corporativo">Inicio de Sesión</span> Agenda
        </h1>
        <p class="text-sm text-gray-500 mt-2">
          Acceso seguro a su portal corporativo
        </p>
      </header>

      <form id="loginForm" class="space-y-6" novalidate>

        <div>
          <label for="usuario" class="block text-sm font-medium mb-1 text-grisTexto">
            Usuario
          </label>
          <input
            type="text"
            id="usuario"
            class="w-full px-4 py-2.5 bg-white text-grisTexto border border-grisBorde rounded-lg
                   focus:outline-none focus:border-corporativo focus:ring-0 shadow-sm
                   focus:shadow-inputFocus
                   transition duration-200 ease-in-out"
            placeholder="Ingrese su correo electrónico o usuario"
          />
        </div>

        <div>
  <div class="flex justify-between items-end mb-1">
      <label for="password" class="block text-sm font-medium text-grisTexto">
        Contraseña
      </label>
      <button type="button" id="btnGenerar" 
        class="text-[10px] font-bold text-corporativo hover:text-corporativoDark uppercase tracking-wider flex items-center gap-1 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
        Generar Segura
      </button>
    </div>
    <input
      type="password"
      id="password"
      class="w-full px-4 py-2.5 bg-white text-grisTexto border border-grisBorde rounded-lg
             focus:outline-none focus:border-corporativo focus:ring-0 shadow-sm
             focus:shadow-inputFocus transition duration-200 ease-in-out"
      placeholder="Ingrese su contraseña"
    />
  </div>

        <div class="text-right">
          <a href="recuperacion.html" class="text-xs font-semibold text-corporativo hover:text-corporativoDark transition">
            ¿Olvidó su contraseña?
          </a>
        </div>

        <div class="text-right">
          <a href="register.html" class="text-xs font-semibold text-corporativo hover:text-corporativoDark transition">
            Crear Cuenta
          </a>
        </div>

        <div
          id="error"
          class="hidden text-sm text-red-700 bg-red-100 border border-red-300
                 rounded-lg px-4 py-3 font-medium"
        ></div>

        <button
          type="submit"
          class="w-full bg-corporativo text-white py-3 rounded-lg
                 font-bold text-base tracking-wide shadow-md
                 transition-all duration-300 ease-in-out
                 hover:bg-corporativoDark hover:shadow-lg
                 active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-corporativo/30"
        >
          <span id="buttonText">ACCEDER</span>
        </button>

      </form>

    </section>

    <footer class="text-center mt-6 text-xs text-gray-400">
        &copy; Andros. Todos los derechos reservados.
    </footer>

  </main>

  <script>
    document.getElementById('btnGenerar').addEventListener('click', () => {
      const longitud = 16;
      const caracteres = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*";
      let password = "";
      
      // Generación segura usando Web Crypto API
      const array = new Uint32Array(longitud);
      window.crypto.getRandomValues(array);
    
      for (let i = 0; i < longitud; i++) {
        password += caracteres[array[i] % caracteres.length];
      }
    
      const passwordInput = document.getElementById('password');
      
      // Mostrar la contraseña temporalmente para que el usuario la vea/copie
      passwordInput.value = password;
      passwordInput.type = "text";
      
      // Cambiar el color del borde para feedback visual
      passwordInput.classList.add('border-corporativo');
    
      // Volver a ocultarla después de 5 segundos
      setTimeout(() => {
        passwordInput.type = "password";
        passwordInput.classList.remove('border-corporativo');
      }, 5000);
    });
  </script>


</body>
</html>
