<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda de turnos organizada con vista clara y responsiva.">
  <title>Agenda</title>
  <link rel="stylesheet" href="../css/general.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/agenda.css">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/logo-transparente-tp-link-blanco.png">
  <link rel="shortcut icon" href="img/logo-transparente-tp-link-blanco.png?v=2" type="image/x-icon">
</head>
<body>

  <header class="header">
    <div class="header-container">
      <div class="logo-container">
        <img src="../img/logo-transparente-tp-link-blanco.png" alt="Logo" class="logo">
      </div>
      <h1>Agenda de Turnos</h1>
      <button class="menu-toggle" aria-label="Abrir menú">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>
      <nav class="top-nav">
        <ul>
          <li><a href="../index.html">Menú</a></li>
          <li><a href="../html/cliente.html">Clientes</a></li>
          <li><a href="../html/tecnico.html">Técnicos</a></li>
          <li><a href="../html/turno.html">Turnos</a></li>
          <li><a href="../html/agenda.html" class="active">Agenda</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container main-content">
    <div id="agendaContainer"></div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 S-Link | Gestión de Agenda</p>
    </div>
  </footer>

  <!-- Toast container — dentro del body, antes de scripts ✅ -->
  <div id="toast-container"></div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const menuToggle = document.querySelector('.menu-toggle');
      const nav        = document.querySelector('.top-nav');
      menuToggle.addEventListener('click', () => {
        nav.classList.toggle('show');
        menuToggle.classList.toggle('open');
      });
    });
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Menú toggle
      const menuToggle = document.querySelector('.menu-toggle');
      const nav        = document.querySelector('.top-nav');
      menuToggle.addEventListener('click', () => {
        nav.classList.toggle('show');
        menuToggle.classList.toggle('open');
      });
    
      // ← Ajustar padding-top del main al alto real del header
      const header = document.querySelector('.header');
      const main   = document.querySelector('.main-content');
      if (header && main) {
        const ajustar = () => {
          main.style.paddingTop = (header.offsetHeight + 16) + 'px';
        };
        ajustar();
        window.addEventListener('resize', ajustar);
      }
    });
  </script>

  <!-- Script al final del body ✅ -->
  <script type="module" src="../js/src/app/main.js"></script>


</body>
</html>
