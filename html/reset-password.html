<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva Contraseña - Agenda</title>
  <link rel="shortcut icon" href="../img/logo-transparente-tp-link-blanco.png" type="image/x-icon">
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            corporativo: "#005691",
            corporativoDark: "#153d60",
            grisTexto: "#333333",
            grisBorde: "#dddddd",
          },
          boxShadow: {
            suave: "0 10px 30px rgba(0,0,0,0.08)",
            inputFocus: "0 0 0 3px rgba(0, 86, 145, 0.2)",
          },
        },
      },
    };
  </script>
  <style>
    .initial-hidden { opacity: 0; transform: scale(0.95); }
    .show-form      { opacity: 1; transform: scale(1); }
  </style>
</head>

<body class="min-h-screen bg-gray-50 flex items-center justify-center px-4 text-grisTexto">

  <main id="resetContainer" class="w-full max-w-sm initial-hidden transition-all duration-700 ease-out">
    <section class="bg-white border border-grisBorde rounded-2xl shadow-suave p-10" style="min-width:380px;">

      <header class="text-center mb-8">
        <h1 class="text-3xl font-extrabold tracking-tight text-corporativoDark">
          <span class="text-corporativo">Nueva Contraseña</span> Agenda
        </h1>
        <p class="text-sm text-gray-500 mt-2">Ingresá tu nueva contraseña para continuar.</p>
      </header>

      <!-- Estado: token inválido -->
      <div id="tokenInvalido" class="hidden text-center">
        <p class="text-red-600 font-medium mb-4">El enlace es inválido o ya expiró.</p>
        <a href="recuperacion.html" class="text-corporativo font-semibold hover:text-corporativoDark transition">
          Solicitar nuevo enlace
        </a>
      </div>

      <!-- Formulario -->
      <form id="resetForm" class="space-y-6" novalidate>

        <div>
          <label for="password" class="block text-sm font-medium mb-1 text-grisTexto">
            Nueva Contraseña
          </label>
          <input type="password" id="password"
            class="w-full px-4 py-2.5 bg-white text-grisTexto border border-grisBorde rounded-lg
                   focus:outline-none focus:border-corporativo shadow-sm focus:shadow-inputFocus
                   transition duration-200 ease-in-out"
            placeholder="Mínimo 6 caracteres"
          />
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-medium mb-1 text-grisTexto">
            Confirmar Contraseña
          </label>
          <input type="password" id="confirmPassword"
            class="w-full px-4 py-2.5 bg-white text-grisTexto border border-grisBorde rounded-lg
                   focus:outline-none focus:border-corporativo shadow-sm focus:shadow-inputFocus
                   transition duration-200 ease-in-out"
            placeholder="Repetí tu contraseña"
          />
        </div>

        <div id="message" class="hidden text-sm text-center font-medium rounded-lg px-4 py-3"></div>

        <button type="submit"
          class="w-full bg-corporativo text-white py-3 rounded-lg font-bold text-base tracking-wide
                 shadow-md transition-all duration-300 hover:bg-corporativoDark hover:shadow-lg
                 active:scale-[0.99] focus:outline-none focus:ring-4 focus:ring-corporativo/30">
          <span id="buttonText">Guardar Contraseña</span>
        </button>

      </form>

    </section>

    <footer class="text-center mt-6 text-xs text-gray-400">
      &copy; Andros. Todos los derechos reservados.
    </footer>
  </main>

  <script>
    const API_BASE_URL = "https://andros-net.com.ar/api/v1";

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("resetContainer");
      setTimeout(() => {
        container.classList.remove("initial-hidden");
        container.classList.add("show-form");
      }, 10);

      // Leer token de la URL
      const token = new URLSearchParams(window.location.search).get("token");

      if (!token) {
        document.getElementById("resetForm").style.display = "none";
        document.getElementById("tokenInvalido").classList.remove("hidden");
        return;
      }

      const form            = document.getElementById("resetForm");
      const passwordInput   = document.getElementById("password");
      const confirmInput    = document.getElementById("confirmPassword");
      const messageDiv      = document.getElementById("message");
      const buttonText      = document.getElementById("buttonText");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        hideMessage();

        const password = passwordInput.value.trim();
        const confirm  = confirmInput.value.trim();

        if (!password || !confirm) {
          showMessage("Completá ambos campos.", "error"); return;
        }
        if (password.length < 6) {
          showMessage("La contraseña debe tener al menos 6 caracteres.", "error"); return;
        }
        if (password !== confirm) {
          showMessage("Las contraseñas no coinciden.", "error"); return;
        }

        buttonText.textContent = "Guardando...";
        form.querySelector("button").disabled = true;

        try {
          const res = await fetch(`${API_BASE_URL}/auth/reset-password`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token, password }),
          });

          if (!res.ok) {
            const err = await res.json();
            // Token expirado o inválido
            if (res.status === 400) {
              form.style.display = "none";
              document.getElementById("tokenInvalido").classList.remove("hidden");
              return;
            }
            throw new Error(err.detail || "Error al actualizar");
          }

          showMessage("¡Contraseña actualizada! Redirigiendo...", "success");
          setTimeout(() => { window.location.href = "login.html"; }, 2000);

        } catch (err) {
          showMessage(err.message, "error");
        } finally {
          buttonText.textContent = "Guardar Contraseña";
          form.querySelector("button").disabled = false;
        }
      });

      function showMessage(mensaje, type) {
        messageDiv.textContent = mensaje;
        messageDiv.classList.remove("hidden","bg-red-100","text-red-700","bg-green-100","text-green-700");
        messageDiv.classList.add(
          type === "error" ? "bg-red-100" : "bg-green-100",
          type === "error" ? "text-red-700" : "text-green-700"
        );
      }

      function hideMessage() { messageDiv.classList.add("hidden"); }
    });
  </script>

</body>
</html>
